description: >-
  FinOps view of LOVO AI (Genny) spend. LOVO is sold as monthly/annual
  subscription tiers (Free, Basic, Pro, Pro+, Enterprise), each carrying a
  character/credit allowance. API usage is not billed separately - TTS credits
  are deducted from the account tied to the API key and draw down the same
  subscription allowance used by the Genny app. The dominant cost driver is
  therefore the number and length of TTS conversions (characters synthesized)
  against the tier allowance, with tier upgrades or Enterprise agreements
  covering higher volume.
notes: >-
  Per-tier character/credit allowances and overage handling are not reconciled
  here; verify on the LOVO pricing page. There is a 20 requests/min rate limit
  and a 500-character cap per conversion, both of which shape how usage
  accumulates against the allowance.
