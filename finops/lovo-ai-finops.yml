meters:
- name: characters_synthesized
  description: Characters of text converted to speech via TTS conversions, drawn from the subscription allowance (max 500 per conversion).
  unit: characters
  aggregation: sum
  dimensions:
  - account
  - speaker
- name: tts_conversions
  description: Number of TTS jobs submitted (sync and async), each deducting credits from the account.
  unit: requests
  aggregation: sum
  dimensions:
  - account
- name: subscription_fee
  description: Recurring monthly/annual subscription fee for the account's plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track characters synthesized and TTS conversions per account/API key against the tier's allowance; read GET /api/v1/teams/status for subscription status and usage.
- name: Allocation
  description: Use separate API keys/accounts per workload or team so TTS credit consumption maps to internal cost centers.
- name: Optimization
  description: Keep conversions within the 500-character cap efficiently, cache/download the 24-hour audio URLs to avoid re-synthesizing, and right-size the subscription tier to actual monthly character volume.
- name: Accountability
  description: Assign an owner per account/tier and review monthly character usage against the plan allowance before it forces an upgrade.
